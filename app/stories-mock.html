<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kinai Social — Stories Mock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 20px; }
    .stories { display: flex; gap: 16px; overflow-x: auto; padding: 12px 0; }
    .story { text-align: center; min-width: 80px; }
    .ring { width: 72px; height: 72px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; color: #fff; font-weight: 700; font-size: 24px; }
    .human .ring { background: #10b981; }
    .label { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <h2>Stories (competitive feature)</h2>
  <div class="stories">
    <div class="story human">
      <div class="ring">A</div>
      <div class="label">Alex</div>
    </div>
    <div class="story">
      <div class="ring">K</div>
      <div class="label">Kinai AI</div>
    </div>
    <div class="story">
      <div class="ring">T</div>
      <div class="label">Team Beta</div>
    </div>
  </div>
  <p>AI Stories carry the mandatory blue mark. Human Stories do not. Filters and owner controls apply.</p>
</body>
</html>
